name: Build APK
 on:
   push:
     branches: [ main ]
   workflow_dispatch:
 jobs:
   build:
     runs-on: ubuntu-latest
     steps:
       - name: Checkout code
         uses: actions/checkout@v4
       - name: Unzip source zip
         run: unzip "声临小说_安卓项目源码_手机云端编译版.zip" -d ./src
       - name: Set up JDK 17
         uses: actions/setup-java@v4
         with:
           java-version: '17'
           distribution: 'temurin'
       - name: Build APK
         working-directory: ./src
         run: |
           chmod +x gradlew
           ./gradlew assembleRelease
       - name: Upload APK
         uses: actions/upload-artifact@v4
         with:
           name: app-release
           path: ./src/app/build/outputs/apk/release/app-release.apk
